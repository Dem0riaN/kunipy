# ============================================================
# kunipy Configuration Example
# ============================================================
# Этот файл содержит все доступные настройки проекта.
# Скопируйте его в config.toml и настройте под себя.
#
# This file contains all available project settings.
# Copy it to config.toml and configure for your setup.
# ============================================================

# ============================================================
# ОСНОВНЫЕ НАСТРОЙКИ / GENERAL SETTINGS
# ============================================================

[app]
# Временная зона приложения (IANA timezone)
# Application timezone (IANA timezone identifier)
# Examples: "UTC", "Europe/Amsterdam", "Europe/Moscow", "America/New_York", "Asia/Tokyo"
timezone = "UTC"

# ============================================================
# ПЕРСОНАЖ / CHARACTER
# ============================================================

[character]
# Имя персонажа (как вас представлять)
# Character name (how to introduce yourself)
name = "Куни"

# Ник персонажа (опционально, для упоминаний)
# Character nickname (optional, for mentions)
nickname = ""

# ============================================================
# ВЛАДЕЛЕЦ (PAPIK) / OWNER
# ============================================================
# ВАЖНО: Эти параметры определяют владельца бота
# IMPORTANT: These parameters define the bot owner

# Имя владельца (используется в промптах)
# Owner name (used in prompts)
papik_name = "Папик"

# Telegram user ID владельца (обязательно!)
# Owner's Telegram user ID (required!)
# Узнать свой ID можно через @userinfobot
# Find your ID via @userinfobot
papik_chat_id = 0

# ============================================================
# LLM НАСТРОЙКИ / LLM SETTINGS
# ============================================================

[llm]
# Модель для чата
# Chat model
# Примеры: "gpt-4", "deepseek-r1:14b", "Qwen/Qwen3.6-35B-A3B-FP8"
model = "deepseek-r1:14b"

[llm.endpoint]
# Эндпоинт OpenAI-совместимого API
# OpenAI-compatible API endpoint
# Примеры:
#   Ollama: "http://localhost:11434/v1/"
#   OpenAI: "https://api.openai.com/v1"
#   vLLM: "http://your-server:8000/v1/"
base_url = "http://localhost:11434/v1/"

# API ключ (если требуется)
# API key (if required)
bearer_key = ""

# ============================================================
# EMBEDDING НАСТРОЙКИ / EMBEDDING SETTINGS
# ============================================================
# Используется для memory system и diary search
# Used for memory system and diary search

[embedding]
# Модель для эмбеддингов
# Embedding model
# Примеры: "text-embedding-3-small", "nomic-embed-text", "mxbai-embed-large"
model = "nomic-embed-text"

[embedding.endpoint]
# Эндпоинт для эмбеддингов (может отличаться от основного LLM)
# Endpoint for embeddings (can differ from main LLM)
# Если не указан, будет использоваться основной [llm]
# If not specified, main [llm] will be used as fallback
base_url = "http://localhost:11434/v1/"
bearer_key = ""

# ============================================================
# TELEGRAM НАСТРОЙКИ / TELEGRAM SETTINGS
# ============================================================

[telegram]
# Включить Telegram-клиент
# Enable Telegram client
enabled = true

# API ID и хеш с my.telegram.org
# API ID and hash from my.telegram.org
# Получите на https://my.telegram.org/apps
# Get them at https://my.telegram.org/apps
api_id = 0
api_hash = ""

# Номер телефона для авторизации (в формате +7XXX...)
# Phone number for authorization (format +7XXX...)
# Если оставить пустым, будет запрошен при первом запуске
# If empty, will be asked on first run
phone = ""

# Директория для данных Telegram
# Directory for Telegram data
database_directory = "data/tdlib"

# ============================================================
# ПАМЯТЬ / MEMORY SYSTEM (ТЗ-002)
# ============================================================

[memory]
# ВАЖНО: kunipy поддерживает НОВУЮ систему памяти с двумя бэкендами:
# IMPORTANT: kunipy supports NEW memory system with two backends:
# 1. SQLite - для небольшого объёма памяти (до ~1000 записей)
# 2. PostgreSQL - для больших объёмов (10,000+ записей)

# Включить новую систему памяти
# Enable new memory system
enabled = true

# Бэкенд хранения / Storage backend
# "sqlite" - SQLite (по умолчанию, для небольших объёмов)
# "postgresql" - PostgreSQL (для больших объёмов, требует установки)
backend = "sqlite"

# Путь к SQLite базе (используется если backend = "sqlite")
# Path to SQLite database (used when backend = "sqlite")
db_path = "data/memory.db"

# URL подключения к PostgreSQL (используется если backend = "postgresql")
# PostgreSQL connection URL (used when backend = "postgresql")
# Формат: postgresql://user:password@host:port/database
# Format: postgresql://user:password@host:port/database
# postgres_url = "postgresql://kunipy:kunipy@localhost:5432/kunipy"

# Минимальная схожесть для поиска воспоминаний (0.0 - 1.0)
# Minimum similarity for memory search (0.0 - 1.0)
min_similarity = 0.5

# Telegram ID владельца для desktop_owner_telegram_id (опционально)
# Owner's Telegram ID for desktop_owner_telegram_id (optional)
# desktop_owner_telegram_id = "123456789"

# ПРИМЕЧАНИЕ: Для миграции с SQLite на PostgreSQL:
# NOTE: To migrate from SQLite to PostgreSQL:
#   1. Установите PostgreSQL и создайте базу данных
#   2. Настройте postgres_url выше
#   3. Запустите: python migrate_to_postgres.py
#   4. Измените backend на "postgresql"
# См. docs/POSTGRESQL_MIGRATION.md для подробностей
# See docs/POSTGRESQL_MIGRATION.md for details

[diary]
# LEGACY система Diary (file-based, *.md files)
# LEGACY Diary system (file-based, *.md files)
# Работает параллельно с новой memory системой выше
# Works in parallel with the new memory system above

# Включить legacy diary систему
# Enable legacy diary system
enabled = true

# Директория с diary файлами (*.md)
# Directory with diary files (*.md)
directory = "diary"

# Минимальная релевантность для поиска (0.0 - 1.0)
# Minimum relevance for search (0.0 - 1.0)
min_relatedness = 0.5

# Порог плагиата (похожести) для пропуска дублей (0.0 - 1.0)
# Plagiarism threshold for skipping duplicates (0.0 - 1.0)
plagiarism_threshold = 0.95

# ============================================================
# БЛОКИРОВКА ДОСТУПА / LOCKDOWN
# ============================================================

[lockdown]
# Режим блокировки / Lockdown mode
# "none" - все могут писать / anyone can write
# "contacts_only" - только контакты / contacts only
# "papik_only" - только владелец / owner only
mode = "papik_only"

# papik_chat_id берётся из секции выше
# papik_chat_id is taken from section above

# Фильтр уведомлений в чатах / Chat notification filter
# Применяется аналогично lockdown mode
# Applied similarly to lockdown mode
# "none" - реагировать на все чаты / respond to all chats
# "contacts_only" - только на контакты / contacts only
# "papik_only" - только владелец / owner only
chat_notification_filter = "none"

# Шанс предложить игнорировать сообщение (0.0 - 1.0)
# Chance to suggest ignoring a message (0.0 - 1.0)
# 0.0 = никогда не предлагать / never suggest
# 1.0 = всегда предлагать / always suggest
suggest_ignore_chance = 0.0

# ============================================================
# ВОЗМОЖНОСТИ / CAPABILITIES
# ============================================================

# --- Слух (распознавание голосовых сообщений) / Hearing (voice recognition) ---
[capabilities.hearing]
enabled = false
model = "whisper-1"

[capabilities.hearing.endpoint]
base_url = "http://localhost:11434/v1/"
bearer_key = ""

# --- Зрение (анализ изображений) / Vision (image analysis) ---
[capabilities.vision]
enabled = false
# Модель должна поддерживать vision (multimodal)
# Model must support vision (multimodal)
# Примеры: "gpt-4-vision-preview", "llava", "Qwen/Qwen3.6-35B-A3B-FP8"
model = "gpt-4-vision-preview"

[capabilities.vision.endpoint]
base_url = "http://localhost:11434/v1/"
bearer_key = ""

# --- Генерация изображений / Image generation ---
[capabilities.image_generation]
enabled = false
model = "dall-e-3"

[capabilities.image_generation.endpoint]
base_url = "http://localhost:11434/v1/"
bearer_key = ""

# --- Веб-поиск / Web search ---
[capabilities.web_search]
enabled = false

# --- Использование стикеров / Use stickers ---
[capabilities.use_stickers]
enabled = false

# --- Фотографирование (камера) / Take photo (camera) ---
[capabilities.take_photo]
enabled = false

# --- Запись голоса (TTS) / Record voice (TTS) ---
[capabilities.record_voice]
enabled = false

# Бэкенд для TTS / TTS backend
# "elevenlabs" или "openai"
backend = "elevenlabs"

# ElevenLabs настройки
[capabilities.record_voice.elevenlabs]
key = ""
voice_id = ""
model_id = "eleven_turbo_v2_5"

# OpenAI TTS настройки
[capabilities.record_voice.openai]
key = ""
model = "tts-1"
voice = "nova"
response_format = "opus"
pcm_sample_rate = 24000

# --- Возможности чата / Chat capabilities ---
[capabilities.join_chats]
# Может присоединяться к чатам / Can join chats
enabled = false

[capabilities.leave_chats]
# Может покидать чаты / Can leave chats
enabled = false

# ============================================================
# ПРОКСИ-СЕРВЕР / PROXY SERVER
# ============================================================

[proxy]
# Включить OpenAI-совместимый прокси-сервер
# Enable OpenAI-compatible proxy server
# Позволяет использовать kunipy как прокси для других приложений
# Allows using kunipy as a proxy for other applications
enabled = false

# Порт для прокси-сервера
# Port for proxy server
port = 8080

# Upstream для проксируемых запросов (опционально)
# Upstream for proxied requests (optional)
# Если не указан, используется основной [llm]
# If not specified, uses main [llm]
[proxy.upstream]
model = ""

[proxy.upstream.endpoint]
base_url = ""
bearer_key = ""

# ============================================================
# WORKER НАСТРОЙКИ / WORKER SETTINGS
# ============================================================

[worker]
# Включить режим сна (sleep consolidation)
# Enable sleep mode (sleep consolidation)
# Консолидирует память во время простоя
# Consolidates memory during idle time
sleep_enabled = false

# Таймаут перед сном (секунды)
# Timeout before sleep (seconds)
sleep_timeout = 300

# Количество воркеров для обработки сообщений
# Number of workers for message processing
# По умолчанию: 1
# Default: 1
worker_count = 1

# ============================================================
# МЕТРИКИ / METRICS
# ============================================================

[metrics]
# Включить Prometheus метрики
# Enable Prometheus metrics
enabled = false

# Порт для метрик
# Metrics port
port = 9090

# ============================================================
# СТАРТОВОЕ ПОВЕДЕНИЕ / STARTUP BEHAVIOR
# ============================================================

# Проверять непрочитанные чаты при старте
# Check unread chats on startup
check_chats_on_startup = true

# ============================================================
# ДОПОЛНИТЕЛЬНЫЕ ПАРАМЕТРЫ / ADDITIONAL PARAMETERS
# ============================================================

# Таймаут запросов к API (секунды)
# API request timeout (seconds)
# request_timeout_secs = 30

# Температура LLM (0.0 - 1.0)
# LLM temperature (0.0 - 1.0)
# Примечание: Не все параметры еще интегрированы в новую Config структуру
# Note: Not all parameters are integrated into new Config structure yet
# temperature = 0.7

# ============================================================
# СТРУКТУРА ДИРЕКТОРИЙ / DIRECTORY STRUCTURE
# ============================================================
#
# kunipy-main/
# ├── config.toml              # Ваша конфигурация / Your config
# ├── config.example.toml      # Этот файл (пример)
# ├── diary/                   # Legacy diary (если enabled)
# │   └── *.md                 # Файлы памяти
# ├── data/                    # Runtime data (gitignored)
# │   ├── memory.db           # SQLite память (если backend = "sqlite")
# │   ├── delivery.db         # Delivery tracking
# │   ├── proxy/              # Proxy server data
# │   └── tdlib/              # Telegram session
# ├── prompts/                # Промпты персонажа
# │   ├── character_base.md
# │   ├── character_appearance.md
# │   └── system.md
# ├── logs/                   # Логи приложения
# └── docs/                   # Документация
#     └── POSTGRESQL_MIGRATION.md  # Руководство по миграции на PostgreSQL
#
# ============================================================
# БЫСТРЫЙ СТАРТ / QUICK START
# ============================================================
#
# 1. Скопируйте этот файл в config.toml:
#    cp config.example.toml config.toml
#
# 2. Получите Telegram credentials с https://my.telegram.org/apps
#    и заполните telegram.api_id и telegram.api_hash
#
# 3. Укажите ваш Telegram user ID в papik_chat_id
#    (получить через @userinfobot)
#
# 4. Настройте LLM endpoint (Ollama, OpenAI, vLLM и т.д.)
#
# 5. Запустите: python -m src.app
#
# ============================================================
