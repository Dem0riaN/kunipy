# ============================================================
# ОСНОВНЫЕ НАСТРОЙКИ
# ============================================================
# GENERAL SETTINGS
# ============================================================

[general]
# Имя персонажа (как вас представлять)
# Character name (how to introduce yourself)
character_name = "Kuni"

# Ник персонажа (для упоминаний)
# Character nickname (for mentions)
character_nickname = "@kunii_chan"

# API ID и хеш с my.telegram.org
# API ID and hash from my.telegram.org
telegram_api_id = 0
telegram_api_hash = ""

# Включить Telegram-клиент (если false, работает только прокси-режим)
# Enable Telegram client (if false, only proxy mode)
telegram_enabled = true

# Номер телефона для авторизации (в формате +7XXX...)
# Если оставить пустым, будет запрошен при первом запуске
# Phone number for authorization (format +7XXX...)
# If empty, will be asked on first run
telegram_phone = ""

# ============================================================
# НАСТРОЙКИ LLM
# ============================================================
# LLM SETTINGS
# ============================================================

[general.llm]
# Модель для чата
# Chat model
model = "deepseek-v4-flash"

# Эндпоинт OpenAI-совместимого API
# OpenAI-compatible API endpoint
[general.llm.endpoint]
base_url = "http://localhost:11434/v1/"
bearer_key = ""  # ключ API (если требуется) / API key (if required)

# ============================================================
# НАСТРОЙКИ ЭМБЕДДИНГОВ
# ============================================================
# EMBEDDING SETTINGS
# ============================================================

[general.embedding]
# Модель для эмбеддингов
# Embedding model
model = "qwen3-embedding"

[general.embedding.endpoint]
base_url = "http://localhost:11434/v1/"
bearer_key = ""

# ============================================================
# РАЗНЫЕ НАСТРОЙКИ
# ============================================================
# MISCELLANEOUS SETTINGS
# ============================================================

[misc]
# Количество токенов в дневнике, после которого запускается сонное сжатие
# Diary token count trigger for sleep consolidation
diary_token_count_trigger = 40000

# Максимальная длина вставляемого в контекст фрагмента дневника (0 = без ограничения)
# Max length of diary snippet injected into context (0 = no limit)
diary_injection_max_length = 0

# Порог плагиата (похожести) для пропуска дублирующихся записей
# Plagiarism threshold for skipping duplicate entries
diary_plagiarism_threshold = 0.97

# Минимальная релевантность для поиска по дневнику
# Minimum relevance for diary search
diary_min_relatedness = 0.80

# Максимальная длина истории чата, хранимой в контексте
# Max chat history length kept in context
chat_max_history_length = 2000

# Температура LLM (0.0 - 1.0)
# LLM temperature (0.0 - 1.0)
llm_temperature = 0.2

# Таймаут запросов к API (сек)
# API request timeout (sec)
request_timeout_secs = 30

# ============================================================
# ВОЗМОЖНОСТИ (включаются по необходимости)
# ============================================================
# CAPABILITIES (enable as needed)
# ============================================================

[capabilities]

# --- Веб-поиск / Web search ---
[capabilities.web_search]
enabled = false
ollama_bearer_key = ""

# --- Зрение (анализ изображений) / Vision (image analysis) ---
[capabilities.vision]
enabled = false
[capabilities.vision.llm_image_to_text]
model = "qwen3.5:9b"
[capabilities.vision.llm_image_to_text.endpoint]
base_url = "http://localhost:11434/v1/"
[capabilities.vision.llm_image_to_text_cheap]
model = "ministral-3:8b"
[capabilities.vision.llm_image_to_text_cheap.endpoint]
base_url = "http://localhost:11434/v1/"

# --- Стикеры / Stickers ---
[capabilities.use_stickers]
enabled = false

# --- Генерация изображений (Stable Diffusion) / Image generation (Stable Diffusion) ---
[capabilities.take_photo]
enabled = false
[capabilities.take_photo.sd]
[capabilities.take_photo.sd.endpoint]
base_url = "http://localhost:7860/"
checkpoint = "novaAnimeXL_ilV170.safetensors"

# --- Распознавание аудио (голосовые сообщения) / Audio recognition (voice messages) ---
[capabilities.hearing]
enabled = false
[capabilities.hearing.llm_audio_to_text]
model = "base"
[capabilities.hearing.llm_audio_to_text.endpoint]
base_url = "http://localhost:9000/v1/"

# --- Синтез речи (TTS) / Text-to-Speech (TTS) ---
[capabilities.record_voice]
enabled = false
backend = "elevenlabs"  # "elevenlabs" или "openai"
[capabilities.record_voice.elevenlabs]
key = ""
voice_id = "pPdl9cQBQq4p6mRkZy2Z"
[capabilities.record_voice.openai]
url = "https://api.openai.com/v1/"
key = ""
model = "tts-1"
voice = "alloy"
response_format = "mp3"
pcm_sample_rate = 24000

# --- Прокси-сервер (OpenAI-совместимый) / Proxy server (OpenAI-compatible) ---
[capabilities.proxy]
enabled = false
